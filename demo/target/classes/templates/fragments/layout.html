<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/dashboard">TechParts B2B</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${currentPage == 'dashboard'} ? 'active'" href="/dashboard">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${currentPage == 'catalog'} ? 'active'" href="/catalog">Catalog</a>
            </li>
            <li class="nav-item" th:if="${user != null and (user.hasRole('B2B_BUYER') or user.isAdmin())}">
                <a class="nav-link" th:classappend="${currentPage == 'orders'} ? 'active'" href="/orders">Orders</a>
            </li>
            <li class="nav-item" th:if="${user != null and (user.isSales() or user.isAdmin())}">
                <a class="nav-link" th:classappend="${currentPage == 'pricing'} ? 'active'" href="/pricing">Pricing</a>
            </li>
            <li class="nav-item" th:if="${user != null and user.isAdmin()}">
                <a class="nav-link" th:classappend="${currentPage == 'account'} ? 'active'" href="/account">Account</a>
            </li>
        </ul>
        <div th:if="${user != null}" class="d-flex align-items-center gap-3">
            <span class="text-secondary small" th:text="${user.username()}"></span>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

</body>
</html>
