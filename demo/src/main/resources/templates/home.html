<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TechParts B2B — Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height:100vh">

<div class="text-center" style="max-width:400px;width:100%;padding:0 16px">
    <div class="mb-4">
        <h2 class="text-white fw-bold mb-1">TechParts B2B</h2>
        <p class="text-secondary">Electronic components wholesale platform</p>
    </div>
    <div class="card border-0 shadow-lg">
        <div class="card-body p-4">
            <h5 class="fw-semibold mb-1">Sign in to your account</h5>
            <p class="text-muted small mb-4">Access is managed by your organization administrator</p>
            <a href="/oauth2/authorization/authenid" class="btn btn-dark w-100 btn-lg">
                Sign in with AuthenID
            </a>
            <div class="mt-4 pt-3 border-top">
                <p class="text-muted small mb-2">Demo accounts</p>
                <div class="d-flex flex-column gap-1" style="font-size:13px;color:#6b7280">
                    <div><code>buyer1</code> / <code>Buyer1234!</code> — Buyer</div>
                    <div><code>sales1</code> / <code>Sales1234!</code> — Sales</div>
                    <div><code>b2badmin</code> / <code>Admin1234!</code> — Admin</div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
