server.port=9000
server.servlet.session.cookie.name=AUTHENIDSESSIONID

spring.application.name=AuthenID
spring.main.banner-mode=off

spring.datasource.url=jdbc:mysql://localhost:3306/authenid?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

authenid.bootstrap.clients.enabled=true
authenid.bootstrap.permissions.enabled=true
authenid.bootstrap.roles.enabled=true
authenid.bootstrap.users.enabled=true
authenid.bootstrap.users.random-password=false
authenid.bootstrap.users.admin-password=Admin1234!
